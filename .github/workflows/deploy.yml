# Build nginx image and push to GHCR, then trigger Komodo redeploy.
# GitHub Secrets: KOMODO_API_URL, KOMODO_API_KEY, KOMODO_API_SECRET.

name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Komodo
        if: success()
        continue-on-error: true
        env:
          KOMODO_API_URL: ${{ secrets.KOMODO_API_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          if [ -z "$KOMODO_API_URL" ] || [ -z "$KOMODO_API_KEY" ] || [ -z "$KOMODO_API_SECRET" ]; then
            echo "Komodo API credentials not fully set; skipping automated deploy trigger."
            exit 0
          fi

          echo "Triggering Komodo PullStack..."
          curl -sS -X POST "${KOMODO_API_URL%/}/execute/PullStack" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d '{"stack":"gtm-landing-pages","services":[]}' \
            --fail-with-body || true

          echo "Triggering Komodo DeployStack..."
          curl -sS -X POST "${KOMODO_API_URL%/}/execute/DeployStack" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d '{"stack":"gtm-landing-pages","services":[]}' \
            --fail-with-body || true
